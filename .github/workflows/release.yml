name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/futureweb/intervals-mcp-server

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build sdist and wheel
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check that the tag matches the project version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(uv version --short)"
          echo "tag: ${tag_version}  pyproject.toml: ${project_version}"
          if [ "${tag_version}" != "${project_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${project_version} in pyproject.toml"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check the built distributions
        run: |
          ls -l dist/
          uv run --locked --with twine twine check dist/*

      - name: Install the wheel into a clean environment and import the server
        # Guards against an sdist/wheel that is missing modules (e.g. a wrong
        # hatch `include` list): the published package must be importable.
        run: |
          uv run --no-project --isolated --python 3.12 --with dist/*.whl \
            python -c "import intervals_mcp_server.server; print('wheel import ok')"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # Tags such as v1.2.0-rc1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          fail_on_unmatched_files: true

  docker:
    name: Docker image (GHCR)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up QEMU (arm64 build)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=intervals-mcp-server
            org.opencontainers.image.description=Model Context Protocol server for Intervals.icu
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build image for smoke test (amd64, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        env:
          # Placeholder values for the import check only; no real credentials.
          API_KEY: test
          ATHLETE_ID: i1
        run: |
          docker run --rm -e API_KEY -e ATHLETE_ID "${IMAGE_NAME}:smoke" \
            python -c "import intervals_mcp_server.server; print('import ok')"
          test "$(docker run --rm "${IMAGE_NAME}:smoke" id -u)" != "0"

      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pypi:
    name: Publish to PyPI
    # Disabled by default. To enable:
    #   1. On PyPI, add a "trusted publisher" for the project futureweb-intervals-mcp with
    #      owner "futureweb", repository "intervals-mcp-server", workflow "release.yml"
    #      and environment "pypi" (https://docs.pypi.org/trusted-publishers/).
    #   2. In this repository create the GitHub environment "pypi" (Settings ->
    #      Environments), ideally with required reviewers.
    #   3. Replace the `if: false` below with `if: ${{ !contains(github.ref_name, '-') }}`
    #      (or remove the line). No API token or secret is needed: the job
    #      authenticates with its OIDC token (permissions: id-token: write).
    if: false
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/futureweb-intervals-mcp/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
