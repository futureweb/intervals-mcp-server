# This workflow warns and then closes issues and PRs that have had no activity for a specified amount of time.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
  - cron: '17 1 * * *'

jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/stale@v10
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        days-before-stale: 60
        days-before-close: 14
        stale-issue-message: 'This issue has had no activity for 60 days and will be closed in 14 days unless there is new activity. Comment if it is still relevant.'
        stale-pr-message: 'This pull request has had no activity for 60 days and will be closed in 14 days unless there is new activity. Rebase or comment if it is still relevant.'
        stale-issue-label: 'no-issue-activity'
        stale-pr-label: 'no-pr-activity'
        exempt-issue-labels: 'pinned,security,help wanted'
        exempt-pr-labels: 'pinned,security'
